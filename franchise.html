    <link rel="stylesheet" href="./styles/franchise.css">

<body>
     <!-- nav-bar started -->
     <header>
        <nav class="nav-bar">
            <div class="menu-div">
                <i class="fa-solid fa-bars menu-icon"></i>
            </div>
            <div class="logo">
                <img src="./assets/logo.webp" alt="logo" class="logo-img">
            </div>
            <div class="nav-items">
                <a href="index.html">Home</a>
                <a href="about.html">About us</a>
                <a href="publications.html">Publications</a>
                <button class="franchise-btn"><a href="franchise.html">Get a Franchise</a></button>
                <button class="order-btn">Order Online <span class="arrow-span arrow-collapse"><i

            </div>
        </nav>
    </header>
    <!-- nav-bar ended -->

    <!-- main-section started  -->
     <h2 class="butler-font main-heading">Get a Franchise</h2>
     <form action="">
        <div>
            <label for="name">Name</label>
            <input type="text">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email">
        </div>
        <div>
            <label for="phn-nmbr">Phone Number</label>
            <input type="number">
        </div>
        <div>
            <label for="mbl-nmber">Mobile Number</label>
            <input type="number">
        </div>
        <div>
            <label for="city">City</label>
            <input type="text">
        </div>
        <div>
            <label for="province">Province</label>
            <input type="text">
        </div>
        <div>
            <label for="country">Country</label>
            <input type="text">
        </div>
        <div>
            <label for="brands">Brands</label>
            <select name="brands" id="brands" placeholder="What Frachise are you interested in">
                <option value="" aria-placeholder="What Frachise are you interested in"></option>
                <option value="">Village</option>
                <option value="">Express</option>
                <option value="">Promo</option>
